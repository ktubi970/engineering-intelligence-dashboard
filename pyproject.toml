[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-intelligence-dashboard"
version = "0.1.0"
description = "Engineering delivery intelligence and merge-time forecasting."
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas==3.0.3",
    "plotly==6.9.0",
    "requests==2.34.2",
    "scikit-learn==1.9.0",
    "streamlit==1.59.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
